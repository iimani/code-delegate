name: opencode
description: Local AI coding agent via OpenCode CLI (LM Studio, Ollama, etc.)
check_command: command -v opencode
list_models_command: opencode models 2>/dev/null
default_model: ""
models: dynamic
capabilities:
  - single-file
  - boilerplate
  - test-generation
  - crud
tags:
  security_ok: false
  cross_file: false
  type_reasoning: false
cost_tier: free
