name: opencode
description: Local AI coding agent via OpenCode CLI (LM Studio, Ollama, etc.)
check_command: command -v opencode
default_model: ""
models:
  - pattern: "*"
    description: "Any model configured in OpenCode (use provider/model format)"
capabilities:
  - single-file
  - boilerplate
  - test-generation
  - crud
tags:
  security_ok: false
  cross_file: false
  type_reasoning: false
cost_tier: free
